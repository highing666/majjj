name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - run: npm ci --prefix web
      - run: make check
      - name: Verify release embedded binary
        run: |
          cargo build --release -p mahjong-server
          cargo test --release -p mahjong-server --lib static_assets::tests
          cargo test --release -p mahjong-server --test lifecycle_and_embed default_server_serves_embedded_assets_with_cache_headers_and_guards
