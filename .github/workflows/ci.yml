name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - run: npm ci --prefix web
      - run: make check
      - name: Verify Windows TTS FastAPI routes
        run: |
          python3 -m venv /tmp/tts-ci-venv
          /tmp/tts-ci-venv/bin/pip install --quiet fastapi httpx pydantic
          MAJJJ_REQUIRE_FASTAPI_TESTS=1 /tmp/tts-ci-venv/bin/python -m unittest discover -s scripts/windows-tts/server -p 'test_*.py' -v
      - name: Verify release embedded binary
        run: |
          cargo build --release -p mahjong-server
          cargo test --release -p mahjong-server --lib static_assets::tests
          cargo test --release -p mahjong-server --test voice_pack_assets_offline
          cargo test --release -p mahjong-server --test lifecycle_and_embed default_server_serves_embedded_assets_with_cache_headers_and_guards
