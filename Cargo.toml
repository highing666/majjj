[workspace]
resolver = "2"
members = [
    "crates/mahjong-core",
    "crates/mahjong-ai",
    "crates/mahjong-server",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_chacha = "0.3"
rand_core = "0.6"
rayon = "1"
thiserror = "2"
ts-rs = { version = "10", features = ["serde-compat"] }
rust-embed = { version = "8", features = ["debug-embed"] }

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
