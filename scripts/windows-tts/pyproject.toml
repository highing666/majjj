[project]
name = "majjj-windows-tts"
version = "1.0.0"
description = "Green native Windows LAN emotional TTS service for Majjj (RTX 3060 12GB co-resident with llama-server)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "numpy>=1.26.0",
  "huggingface-hub>=0.26.0",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
qwen3 = [
  "faster-qwen3-tts>=0.1.0",
  "qwen-tts>=0.1.0",
]
cosyvoice = [
  "onnxruntime-gpu>=1.19.0",
  "wetext>=0.0.4",
]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]
